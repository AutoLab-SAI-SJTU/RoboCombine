[project]
name = "robocombine"
version = "0.1.0"
description = "RoboCombine evaluation code for compositional robot manipulation."
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy",
  "pyyaml",
  "augmax>=0.3.4",
  "torch==2.4.1",
  "torchvision==0.19.1",
  "jax[cuda12]==0.5.3",
  "chex",
  "flax==0.10.2",
  "etils",
  "tyro>=0.9.5",
  "typing-extensions>=4.12.2",
  "dm-tree>=0.1.8",
  "msgpack>=1.0.5",
  "tree>=0.2.4",
  "websockets>=11.0",
  "equinox>=0.11.8",
  "jaxtyping==0.2.36",
  "ml_collections==1.0.0",
  "numpydantic>=1.6.6",
  "orbax-checkpoint==0.11.13",
  "fsspec[gcs]>=2024.6.0",
  "tqdm-loggable>=0.2",
  "rich>=14.0.0",
  "polars>=1.30.0",
  "beartype==0.19.0",
  "treescope>=0.1.7",
  "filelock>=3.16.1",
  "opencv-python",
  "pillow",
  "transformers==4.53.2",
  "diffusers",
  "safetensors",
  "timm==1.0.12",
  "einops==0.8.1",
  "sentencepiece",
  "matplotlib",
  "h5py",
  "dill",
  "transforms3d",
  "sapien==3.0.0b1",
  "mplib==0.2.1",
  "gymnasium==0.29.1",
  "toppra",
  "trimesh==4.4.3",
  "imageio==2.34.2",
  "open3d==0.18.0",
  "easydict",
  "ftfy",
  "omegaconf==2.3.0",
  "qwen-vl-utils",
  "warp-lang==1.11.1",
  "pytest",
]
[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["envs*", "handoff_eval*", "policy*", "openpi*", "openpi_client*", "xvla_progress_predictor*"]
exclude = [
  "assets*",
  "data*",
  "release_artifacts*",
  "handoff_eval_runs*",
  "handoff_eval_runs_smoke*",
  "smoke_logs*",
]
